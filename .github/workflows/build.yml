name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Curriculum prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-dev.txt
      - name: Prüfungen (P2)
        run: python tools/check-curriculum.py
      - name: Fixture-Testsuite
        run: python -m pytest tools/tests -q

  rights-check:
    name: Bildrechte melden
    runs-on: ubuntu-latest
    # Fällt rot bei ungeklärten Bildern, blockiert die Veröffentlichung aber
    # nicht: deploy hängt nur an check und build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/rights-report.py

  build:
    name: Site bauen
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Generatoren, asciidoctor und revealjs
        # Derselbe Ablauf wie lokal — das containerisierte asciidoctor ist die
        # verbindliche Instanz zwischen Linux- und macOS-Geräten.
        run: ./local-convert.sh --skip-check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Auf GitHub Pages veröffentlichen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
