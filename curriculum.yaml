# ============================================================================
# Stoffstruktur SYP 3. Jahrgang — einzige Wahrheit fuer Struktur.
#
# Regeln (setup-curriculum-repository/design.md — P1):
#   * Ein Topic entspricht einem Unterrichtsslot:
#       kind: theorie -> ue: 1     kind: praxis -> ue: 2
#   * Die Lernressource traegt ausser :topic-id: keine Strukturangabe.
#   * Dateipfade werden aus der id abgeleitet, nicht eingetragen:
#       modules/<id>/index.adoc | exercises.adoc | questions.adoc
#       modules/<id>/images/
#   * Diese Datei wird von Hand gepflegt; alles Abgeleitete (Mindmap,
#     Navigation, UE-Uebersicht, Fragenkatalog-Tags) ist generiert.
# ============================================================================

meta:
  jahrgang: jg3
  gegenstand: SYP
  schuljahr: "2026/27"
  unterrichte: 30
  ue_je_unterricht: 3
  slots_je_unterricht:
    theorie: 1        # 1 UE
    praxis: 1         # 2 UE
  zonen:
    einfuehrung: [1]
    kernbetrieb: [2, 25]
    reserve: [26, 30]
  budget:
    theorie: 26       # 1 Einfuehrung + 24 Kernbetrieb + 1 Reserve
    praxis: 56        # 2 Einfuehrung + 48 Kernbetrieb + 6 Reserve
  # Theorie-UE je Block. Feingliederung aus define-syp3-curriculum/design.md:
  #   governance  = 8 Governance + 1 Leistungsfeststellung (Reserve)
  #   vorgehen    = 3 Vorgehensmodelle + 5 SDD + 2 Bruecke
  #   modellierung= 5 UML
  #   werkzeuge   = 1 Kursueberblick (U1) + 1 Was ist Software-Engineering
  budget_je_block:
    governance: 9
    vorgehen: 10
    modellierung: 5
    werkzeuge: 2

blocks:
  - id: governance
    title: Project governance
  - id: vorgehen
    title: Process models and spec-driven development
  - id: modellierung
    title: Modelling with UML
  - id: werkzeuge
    title: Tools and practice

# ============================================================================
# U1 — Einfuehrung
# ============================================================================

