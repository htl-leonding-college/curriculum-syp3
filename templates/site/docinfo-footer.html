<style>
/* Answers and solutions sit collapsed in the document (P5). The button at
   the top opens them all at once — for revision shortly before the exam. */
.reveal-all { margin: 0 0 1.5rem 0; }
.reveal-all button {
  font: inherit;
  font-size: 0.9em;
  padding: 0.35em 0.9em;
  border: 1px solid #cfd3d6;
  border-radius: 4px;
  background: #f5f6f7;
  color: #333;
  cursor: pointer;
}
.reveal-all button:hover { background: #e9ebed; }
#content details > summary.title { cursor: pointer; }

/* Question catalogue: drop-downs, attribute tags, outcome references. */
.question-filter { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; margin-bottom: 1rem; }
.question-filter label { font-size: 0.9em; }
.question-filter .count { color: #666; font-size: 0.85em; }
table.questions th[data-sort] { white-space: nowrap; }
.tags { background: #eef1f3; border-radius: 3px; padding: 0.1em 0.5em; font-size: 0.8em; color: #555; }
.covers { color: #777; font-size: 0.85em; }
</style>
<script>
(function () {
  var content = document.getElementById('content');
  if (!content) return;
  var blocks = content.querySelectorAll('details');
  if (blocks.length < 2) return;

  var button = document.createElement('button');
  button.type = 'button';
  var bar = document.createElement('div');
  bar.className = 'reveal-all';
  bar.appendChild(button);
  content.insertBefore(bar, content.firstChild);

  function relabel() {
    var open = 0;
    Array.prototype.forEach.call(blocks, function (block) { if (block.open) open++; });
    var all = open === blocks.length;
    button.textContent = all ? 'Collapse all' : 'Expand all';
    button.setAttribute('aria-expanded', all ? 'true' : 'false');
  }

  button.addEventListener('click', function () {
    var expand = button.getAttribute('aria-expanded') !== 'true';
    Array.prototype.forEach.call(blocks, function (block) { block.open = expand; });
    relabel();
  });

  Array.prototype.forEach.call(blocks, function (block) {
    block.addEventListener('toggle', relabel);
  });

  relabel();
})();
</script>
